    if (action === "toggle-supplement") {
      const index = Number(element.dataset.index);
      STATE.supplements[index] = !STATE.supplements[index];
      refreshActive(`supp-${index}`);
    }
  }
  document.addEventListener("click", (event) => {
    const actionElement = event.target.closest("[data-action]");
    if (actionElement) {
      handleAction(actionElement);
      return;
    }
    const anchor = event.target.closest('a[href^="#/"]');
    if (!anchor) return;
    const route = anchor.getAttribute("href").slice(2);
    if (!ROUTES.includes(route)) return;
    if (anchor.dataset.nav === "workouts") {
      STATE.workoutDay = TODAY;
      STATE.openExercise = null;
    }
    if (anchor.dataset.nav === "nutrition") {
      STATE.foodDay = TODAY;
    }
    if (window.location.hash === anchor.getAttribute("href")) {
      event.preventDefault();
      activate(route, { focus: true });
    }
  });
  window.addEventListener("hashchange", () => {
    const route = currentByHash();
    if (!route) {
      try {
        history.replaceState(null, "", "#/home");
      } catch (error) {
        window.location.hash = "#/home";
      }
      activate("home", { focus: true });
      return;
    }
    activate(route, { focus: true });
  });
  initializeTheme();
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  if (!currentByHash()) {
    try {
      history.replaceState(null, "", "#/home");
    } catch (error) {
      window.location.hash = "#/home";
    }
  }
  activate(currentByHash() || "home", { focus: false });
})();
</script>
</body>
</html>
